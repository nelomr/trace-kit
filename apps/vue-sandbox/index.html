<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var s = localStorage.getItem("tk-sandbox-scheme");
        if (s === "light" || s === "dark") {
          document.querySelector('meta[name="color-scheme"]').content = s;
        }
      } catch {}
    </script>
    <title>TraceKit OSA-1550 — Vue 3 Optical Spectrum Analyzer</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
