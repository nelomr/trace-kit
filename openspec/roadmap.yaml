# TraceKit SDD Roadmap — machine-readable change ordering
#
# Why this file exists
#   The native dispatcher reports `relationships.dependsOn` per change, but nothing populates
#   it: `gentle-ai sdd-status <change> --json` returned `dependsOn: []` for every change. The
#   OpenSpec convention defines no mechanism to declare it either. So the ordering of the 16
#   changes existed only as prose in
#   `openspec/changes/00-roadmap-decomposition/exploration.md` (sections 2 and 3). A session
#   opening this repository cold could read each change's own `nextRecommended`, but had no way
#   to know which change comes next, or why. This file is that missing index.
#
# How to use it
#   1. Walk the list in `order`. A change is done when its directory has moved under
#      `openspec/changes/archive/`; that is the only durable completion signal.
#   2. The next actionable change is the lowest-numbered one not yet archived whose every
#      `prerequisites` entry IS archived. If a prerequisite is not archived, that prerequisite
#      is what comes next instead.
#   3. For that change, run `gentle-ai sdd-status <name> --cwd . --json` to get its phase state
#      and `nextRecommended`.
#
# This file deliberately records NO per-change phase state. An earlier revision cached `state`
# and an `artifacts` map here, and it was stale within the hour — it reported `design: false`
# for a change whose `design.md` already existed. Caching derived state contradicted this file's
# own division of responsibility, so the fields are gone. THIS FILE OWNS THE ORDER. THE
# DISPATCHER OWNS EACH CHANGE'S PHASE. Nothing is duplicated, so nothing can disagree.
#
# The archive-order rule (load-bearing, not advisory)
#   `sdd-archive` merges a change's spec deltas into `openspec/specs/{capability}/spec.md`.
#   A MODIFIED delta therefore has nothing to modify until the change that ADDED that
#   capability has been archived. Archiving out of order silently produces a MODIFIED delta
#   applied against no baseline. Archive strictly in the order given here. A MODIFIED delta is
#   resolvable once `openspec/specs/{capability}/spec.md` exists; changes 1-3 are archived, so
#   the capabilities they ADDED now have baselines, while every later capability does not yet.
#
# Source of truth for scope and rationale: openspec/changes/00-roadmap-decomposition/exploration.md
# Confirmed product decisions: that file, section 7.
# Evidence backing the acceptance criteria: openspec/changes/00-roadmap-decomposition/research.md

