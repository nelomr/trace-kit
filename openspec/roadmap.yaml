# ---------------------------------------------------------------------------------------------
# Backlog — deliberately NOT scheduled for 1.0.0
# ---------------------------------------------------------------------------------------------
#
# webgpu-compute-decimation (v2.0.0 epic)
#   Moving LTTB and the min/max envelope into compute shaders would remove the Web Worker hop
#   entirely and decimate millions of points on the GPU. It is the correct long-term direction and
#   it is the wrong 1.0.0 decision: it rewrites the graphics pipeline against an API whose browser
#   support is still uneven, and it would do so while the Canvas2D/WebGL2 pair already delivers the
#   throughput this release promises. Recorded here so it is a deferral with a reason rather than
#   an omission. Revisit once 1.0.0 is stable and the dual-engine strategy has real field use.
#
#   The architecture already leaves the door open: `decimation-port` (change 3) is the seam a
#   GPU-backed implementation would plug into without touching a single consumer.
