  # Inserted at revision 6. The two data-model gaps that are cheap now and breaking later.
  #
  # Why: gaps
  #   `decimation-lttb` and `decimation-min-max` guarantee they never EMIT `NaN`/`Infinity`.
  #   Neither says what happens when `NaN` ARRIVES — a dead detector pixel, an aborted sweep, a
  #   saturated ADC sample. Today LTTB would interpolate a straight line across the hole and the
  #   min/max envelope would poison a whole bucket. Both outcomes are a chart that lies about the
  #   measurement, which is the one failure mode a characterization tool may not have. Gap
  #   semantics must be decided in the decimator, because by render time the hole is gone.
  #
  # Why: multi-trace
  #   `SpectrumDataPayload` models exactly one trace. Comparing two sweeps — before/after a
  #   thermal tune, two output ports, a reference against a device under test — is the primary
  #   workflow this library exists to serve, and it is not expressible. Retrofitting it after
  #   changes 10-11 is a breaking change to the published component props of both adapters, so it
  #   lands before any renderer or adapter is written against the single-trace shape.
  - order: 5.7
    name: core-gap-and-multi-trace-model
    prerequisites: 
      - core-scale-transforms
    capabilities: not_yet_specified
    # Intended capability surface (to be pinned by sdd-propose/sdd-spec):
    #   gap-sentinel-semantics    ADDED    — NaN is a break, not a value; never interpolated across
    #   decimation-lttb           MODIFIED — buckets split at gaps; gap survives decimation
    #   decimation-min-max        MODIFIED — envelope preserves the hole instead of poisoning it
    #   trace-collection-payload  ADDED    — N payloads sharing an X domain, per-trace axis binding
    #   canvas2d-trace-rendering  MODIFIED — path break on gap; per-trace style resolution
    #   visual-golden-corpus      MODIFIED — goldens for gapped and overlaid traces

