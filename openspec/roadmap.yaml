  # Inserted after the 16-change decomposition was written, which is why its `order` is
  # fractional rather than 6. `order` is a sort key, not an identity: renumbering 6-16 would
  # silently invalidate the 56 prose references of the form "change N" already written into
  # the change artifacts. A fractional key keeps every existing number correct and still
  # places this change exactly where the walk rule needs it.
  #
  # Why this change exists at all
  #   `renderers-canvas2d` ships a renderer no automated test can prove paints correctly. A
  #   canvas only returns already-rasterized pixels, so a wrong colour, a wrong paint order or
  #   a missing `stroke` ships green; that change's design records this as risk R1 and reduces
  #   the exposed surface to a fixed call sequence asserted against a fake context, but it
  #   cannot close it. The mitigation R1 names is "a real-browser runner as a separate
  #   toolchain change" — this is that change. Without an entry here, that sentence is an
  #   omission with good wording rather than a deferral.
  #
  #   It is placed before `renderers-webgl2` and listed among its prerequisites deliberately.
  #   Change 7's entire premise is a second engine producing the same picture as the first;
  #   that claim is unverifiable without a reference image of the first. Arriving at 1.0.0
  #   having never asserted rendered output is the failure this ordering prevents.
  - order: 5.5
    name: browser-visual-regression-harness
    prerequisites: 
      - renderers-canvas2d
    capabilities: not_yet_specified

  # Inserted at revision 6. Same fractional-key rationale as 5.5: `order` is a sort key, not an
  # identity, and renumbering 6-16 would invalidate the prose references of the form "change N"
  # already written into the change artifacts.
  #
  # Why this change exists at all, and why it is FIRST
  #   `viewport-transform` shipped in change 5 is strictly linear and strictly single-Y-axis:
  #   its eight requirements define one forward projection, one inverse, one tick selector, all
  #   over a single `{x,y}` domain pair. Every photonic sweep an instrument produces is at least
  #   two co-plotted quantities on incompatible scales — optical power in dBm (logarithmic) and
  #   phase in radians (linear) against one wavelength axis in nm. There is no way to draw that
  #   with the transform as archived.
  #
  #   It is placed before `svg-vector-export` and `renderers-webgl2` deliberately. Both consume
  #   the projection: the exporter emits axis ticks and path coordinates, the GL pipeline bakes
  #   the domain-to-clipspace matrix into a uniform. Adding a second axis and a log scale after
  #   either exists means rewriting a shipped shader and a shipped exporter against a changed
  #   contract. Doing it here changes an unimplemented consumer instead.
