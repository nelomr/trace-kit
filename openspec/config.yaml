# OpenSpec Configuration — trace-kit

project: trace-kit
stack:
  monorepo: pnpm+turborepo
  language: typescript
  renderers: webgl2+canvas2d
  frameworks: vue3+react
  testing: vitest+playwright
  bundler: tsup

strict_tdd: true
test_command: pnpm run test

session:
  execution_mode: interactive
  artifact_store: both
  # `ask-always` was not a value this contract defines (the domain is ask-on-risk | single-pr |
  # auto-chain | exception-ok), so it could not be routed on. Replaced after the user explicitly
  # accepted `size:exception` up front for oversized changes: one PR, no size-driven split, and
  # no stop to re-confirm the exception per change.
  delivery_strategy: exception-ok
  review_budget_lines: 400
