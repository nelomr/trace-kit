name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: |
            turbo-

      - name: Verify typecheck task is non-vacuous
        run: node scripts/verify-turbo-ran.mjs typecheck

      - name: Type check (all packages)
        run: pnpm exec turbo run typecheck

      - name: Verify lint task is non-vacuous
        run: node scripts/verify-turbo-ran.mjs lint

      - name: Lint
        run: pnpm exec turbo run lint

      - name: Verify test task is non-vacuous
        run: node scripts/verify-turbo-ran.mjs test

      - name: Unit tests (all packages)
        run: pnpm run test

      - name: Lint-rules ban is enforced (regression meta-test)
        run: pnpm exec vitest run packages/core/test/lint-rules.test.ts
