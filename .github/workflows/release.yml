name: Release

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version and Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx changeset version

          # Sync package changelogs into the root CHANGELOG.md (matching dashboar-portfolio)
          node scripts/sync-root-changelog.mjs

          if [[ -n $(git status --porcelain) ]]; then
            echo "Changes detected, committing version bumps..."

            # Sync core package version to root package.json so global tag matches
            CORE_VERSION=$(node -p "require('./packages/core/package.json').version")
            node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('./package.json','utf8')); pkg.version='$CORE_VERSION'; fs.writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');"

            git add .
            git commit --no-verify -m "chore(release): version packages [skip ci]"

            GLOBAL_TAG="v$CORE_VERSION"

            for attempt in 1 2 3 4 5; do
              existing_tags=$(git tag -l)
              if [[ -n "$existing_tags" ]]; then
                echo "$existing_tags" | xargs git tag -d
              fi
              npx changeset tag

              if git push --atomic origin main --tags; then
                break
              fi

              if [[ $attempt -eq 5 ]]; then
                echo "::error::Failed to push release after 5 attempts"
                exit 1
              fi

              echo "Push rejected (attempt $attempt) — main moved, rebasing and retrying..."
              git fetch origin main
              git rebase origin/main
            done

            if ! gh release view "$GLOBAL_TAG" > /dev/null 2>&1; then
              gh release create "$GLOBAL_TAG" \
                --target main \
                --title "$GLOBAL_TAG" \
                --generate-notes \
                --latest
              echo "✅ GitHub Release $GLOBAL_TAG successfully created!"
            else
              echo "⚠️ GitHub Release $GLOBAL_TAG already exists, skipping."
            fi
          else
            echo "No changesets found, nothing to version or publish."
          fi
